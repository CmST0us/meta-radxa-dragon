#@TYPE: Machine
#@NAME: qcs6490-radxa-dragon-q6a
#@DESCRIPTION: Machine configuration for Radxa Dragon Q6A with QCS6490

require conf/machine/include/qcom-qcs6490.inc

MACHINE_FEATURES = "usbhost usbgadget alsa wifi bluetooth"

# AIC8800D80 WiFi/BT 固件 (USB)，配合内核 in-tree 驱动
# (CONFIG_AIC8800_WLAN_SUPPORT / CONFIG_BT_AIC_BTUSB)。
# 用 RRECOMMENDS 软依赖，随 kernel-modules 进同一镜像。
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " wifibt-firmware-aic8800d80-usb"

KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/qcs6490-radxa-dragon-q6a.dtb \
                      "

# Additional dtbo to overylay on top of kernel devicetree files
KERNEL_TECH_DTBOS[qcs6490-radxa-dragon-q6a] = " \
    qcm6490-graphics.dtbo \
    qcm6490-video.dtbo \
    "
# Recipe providers of above dtbo files.
KERNEL_TECH_DTBO_PROVIDERS = "\
    qcom-graphicsdevicetree \
    qcom-videodtb \
"
